<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MMA Picks Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <a href="{{ url_for('web.home') }}">MMA Picks Tracker</a>
    <nav>
        <a href="{{ url_for('web.home') }}">Dashboard</a>
        <a href="{{ url_for('web.events') }}">Events</a>
        <a href="{{ url_for('catalog.cards') }}">Cards</a>
        <a href="{{ url_for('web.analytics') }}">Analytics</a>
        <a href="{{ url_for('web.new_event') }}">New Card</a>
    </nav>
</header>
<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
